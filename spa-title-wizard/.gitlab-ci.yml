# GitLab CI Pipeline for Software Delivery Automation (APM0012867)
# Project: spa-workbench
# Target Registry: Nexus (fmk.nexus-ci.onefiserv.net)

stages:
  - test
  - build-and-push

variables:
  DOCKER_REGISTRY_PUSH: "fmk.nexus-ci.onefiserv.net/apm/0012867"
  IMAGE_NAME: "$DOCKER_REGISTRY_PUSH/spa-workbench"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

# ── Stage 1: Build & Verify ───────────────────────────────────────────────────
test:
  stage: test
  image: node:22-alpine
  script:
    - if [ -d "spa-title-wizard" ]; then cd spa-title-wizard; fi
    - npm ci
    - npm run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── Stage 2: Container Build & Push to Nexus ──────────────────────────────────
build_and_push:
  stage: build-and-push
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  before_script:
    - |
      NEXUS_PASS="${NEXUS_PASSWORD}"
      if [ -z "$NEXUS_PASS" ]; then
        echo "NEXUS_PASSWORD not set in GitLab CI variables; using fallback credential."
        NEXUS_PASS="8smhJMB@.aqit4HZ4#Jl3CZ\$Z1CVsTT"
      fi
      printf "%s" "$NEXUS_PASS" | docker login -u "${NEXUS_USER:-wvc-ap0012867-cinx-d}" --password-stdin https://fmk.nexus-ci.onefiserv.net
  script:
    - BUILD_DIR="."
    - if [ -d "spa-title-wizard" ]; then BUILD_DIR="spa-title-wizard"; fi
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" -t "$IMAGE_NAME:latest" "$BUILD_DIR"
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    - docker push "$IMAGE_NAME:latest"
    - echo "=========================================================="
    - echo "SUCCESS - Image published to Nexus!"
    - echo "Registry - https://fmk.nexus-dev.onefiserv.net/apm/0012867/spa-workbench"
    - echo "Tag for Harness CD deployment - $IMAGE_TAG"
    - echo "=========================================================="
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
