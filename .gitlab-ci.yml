# GitLab CI Pipeline for Software Delivery Automation (APM0012867)
# Project: spa-workbench
# Target Registry: Nexus (fmk.nexus-ci.onefiserv.net)

variables:
  app_version: "$CI_COMMIT_SHORT_SHA"
  nexus_registry: "fmk.nexus-ci.onefiserv.net/apm/0012867"
  image_name: "${nexus_registry}/spa-workbench"
  npm_registry: "https://nexus-cd.onefiserv.net/repository/npm-apm0012867/"
  FMK_DIND_IMG: "fmk.nexus.onefiserv.net/fmk/ext-tools/fmk-dind:FMK-11-21-24"

  # DIND settings matching Fiserv working configuration
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: tcp://docker:2376/
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "0"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - build
  - release

# ── Stage 1: Build Application ────────────────────────────────────────────────
Build Application:
  stage: build
  image: "fmk.nexus.onefiserv.net/fmk/node/node20:FMK-26-03-04"
  script:
    - if [ -d "spa-title-wizard" ]; then cd spa-title-wizard; fi
    - echo "Configuring npm registry..."
    - npm config set registry "${npm_registry}"
    - npm config set strict-ssl false

    - echo "Installing dependencies..."
    - npm install --legacy-peer-deps || (echo "Failed to run npm install." && exit 1)

    - echo "Building application..."
    - npm run build || (echo "Failed to build React application." && exit 1)

    - echo "Build output contents:"
    - ls -la dist || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - dist/
      - spa-title-wizard/dist/

# ── Stage 2: Build and Push Docker Image ───────────────────────────────────────
Build and Push Docker Image:
  stage: release
  image: "$FMK_DIND_IMG"
  services:
    - name: "$FMK_DIND_IMG"
      alias: docker
  tags:
    - docker

  needs:
    - job: Build Application
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - BUILD_DIR="."
    - if [ -d "spa-title-wizard" ]; then BUILD_DIR="spa-title-wizard"; fi

    - echo "Logging into Nexus registry..."
    - docker logout fmk.nexus-ci.onefiserv.net || true
    - echo "${NEXUS_CI_PASSWORD}" | docker login fmk.nexus-ci.onefiserv.net --username "${NEXUS_CI_ID}" --password-stdin

    - echo "Building Docker image ${image_name}:${app_version} ..."
    - docker build -t "${image_name}:${app_version}" -t "${image_name}:latest" "$BUILD_DIR"

    - echo "Pushing Docker image..."
    - docker push "${image_name}:${app_version}" || (echo "Docker push failed." && exit 1)
    - docker push "${image_name}:latest" || true

    - echo "=========================================================="
    - echo "SUCCESS: Image published to Nexus!"
    - echo "Tag for Harness CD deployment: ${app_version}"
    - echo "=========================================================="
